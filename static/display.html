<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Translation — Display</title>
  <link rel="stylesheet" href="/static/common.css">
  <style>
    main { font-size: clamp(1.4rem, 3.4vw, 2.6rem); }
    footer { padding: 0.6rem 1.2rem; color: #7d8fa3; font-size: 0.95rem;
             border-top: 1px solid #1c2733; display: flex; gap: 1rem;
             align-items: center; justify-content: center; }
    #qr { width: 92px; height: 92px; background: #fff; padding: 4px;
          border-radius: 6px; flex: 0 0 auto; }
    footer strong { color: #e8eef5; }
  </style>
</head>
<body>
  <header>
    <span><span id="status-dot"></span><span id="status-text">connecting…</span></span>
    <span>Live Translation</span>
  </header>
  <main id="captions">
    <div class="empty-state" id="empty">Waiting for the speaker…</div>
  </main>
  <footer>
    <img id="qr" src="/qr.svg" alt="QR code to the phone page">
    <span>Scan, or type <strong id="view-url"></strong> on your phone</span>
  </footer>
  <script src="/static/display.js"></script>
</body>
</html>
