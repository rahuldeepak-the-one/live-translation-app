<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Translation — Display</title>
  <script>
    /* Paint-blocking on purpose. A module script is deferred, so without this
       a dark-themed hall gets a white flash across the projector on every
       load. theme.js re-runs the decision properly the moment it executes —
       validating the value and falling back to light — so this is a fast path,
       not a second source of truth. */
    try {
      document.documentElement.dataset.theme =
        new URLSearchParams(location.search).get("theme")
        || localStorage.getItem("theme") || "light";
    } catch (e) {
      document.documentElement.dataset.theme = "light";
    }
  </script>
  <link rel="stylesheet" href="/static/display.css">
</head>
<body>
  <header class="wall-header">
    <span class="live" id="live" data-state="down">
      <span class="live-dot"></span><span id="live-label">CONNECTING</span>
    </span>
    <span class="en-bar" id="en-bar" hidden>
      <span class="en-label">English</span>
      <p class="en-text" id="en-text"></p>
    </span>
    <button class="theme-toggle" id="theme-toggle" type="button"
            aria-label="Switch to dark theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"></path>
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </header>

  <div class="grid" id="grid" data-cards="0"></div>

  <!-- No address in text. The QR carries it; printing an IP on the wall puts
       a technical string in front of the whole congregation. -->
  <footer class="wall-footer">
    <span>Scan for phone captions</span>
    <img class="qr" src="/qr.svg" alt="QR code to the phone captions page">
  </footer>

  <script type="module" src="/static/display.js"></script>
</body>
</html>
